  <body class="bg-slate-950 text-slate-100 min-h-screen selection:bg-emerald-500 selection:text-white font-sans antialiased overscroll-none">
    <div id="root"></div>

    <!-- Service Worker Registration for PWA & Offline Support -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then((registration) => {
              console.log('PWA ServiceWorker registered successfully with scope:', registration.scope);
            })
            .catch((err) => {
              console.warn('PWA ServiceWorker registration skipped or failed:', err);
            });
        });
      }
    </script>
